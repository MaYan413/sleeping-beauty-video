    <style>

        body {
            background: linear-gradient(135deg, #0c0a1a 0%, #1a1430 30%, #2d1b3d 60%, #0c0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
            padding: 20px;
            background-attachment: fixed;
        }

        /* 瑁呴グ鎬ф槦鍏?*/
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(2px 2px at 10% 15%, rgba(255, 215, 200, 0.6), transparent),
                radial-gradient(2px 2px at 25% 35%, rgba(255, 215, 200, 0.5), transparent),
                radial-gradient(1px 1px at 40% 20%, rgba(255, 215, 200, 0.7), transparent),
                radial-gradient(2px 2px at 55% 10%, rgba(255, 215, 200, 0.4), transparent),
                radial-gradient(1px 1px at 70% 40%, rgba(255, 215, 200, 0.6), transparent),
                radial-gradient(2px 2px at 85% 25%, rgba(255, 215, 200, 0.5), transparent),
                radial-gradient(1px 1px at 15% 55%, rgba(255, 215, 200, 0.4), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(255, 215, 200, 0.5), transparent),
                radial-gradient(1px 1px at 80% 60%, rgba(255, 215, 200, 0.3), transparent),
                radial-gradient(2px 2px at 35% 80%, rgba(255, 215, 200, 0.4), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 40px 36px 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 80px rgba(180, 140, 200, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header .icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f0d8e0;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            text-shadow: 0 2px 12px rgba(220, 180, 200, 0.3);
        }

        .header .subtitle {
            font-size: 1rem;
            color: rgba(220, 200, 215, 0.7);
            font-weight: 400;
            letter-spacing: 0.03em;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200, 160, 190, 0.6), transparent);
            margin: 16px auto 24px;
            border-radius: 2px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.3s ease;
        }

        .video-wrapper:hover {
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1), 0 0 60px rgba(180, 140, 200, 0.1);
        }

        video {
            display: block;
            width: 100%;
            height: auto;
            outline: none;
        }

        /* 鑷畾涔夎棰戞帶浠舵牱寮忚鐩栵紙浠?webkit 娴忚鍣級 */
        video::-webkit-media-controls-panel {
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        }

        video::-webkit-media-controls-play-button {
            color: #f0d8e0;
        }

        .description {
            margin-top: 28px;
            text-align: center;
            color: rgba(220, 210, 225, 0.8);
            line-height: 1.8;
            font-size: 0.95rem;
        }

        .description p {
            margin-bottom: 8px;
        }

        .footer {
            margin-top: 28px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
        }

        .footer a {
            color: rgba(200, 170, 200, 0.6);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: rgba(220, 200, 220, 0.9);
        }

        /* 绉诲姩绔€傞厤 */
        @media (max-width: 640px) {

            }

            }

            .header .icon {
                font-size: 36px;
            }

            .header .subtitle {
                font-size: 0.9rem;
            }

            .description {

            }
        }
    </style>
</head>
